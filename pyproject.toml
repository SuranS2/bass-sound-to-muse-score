[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-sound-to-muse-score"
version = "0.1.0"
description = "Local MCP server bundle converting YouTube/audio files into Electric Bass MusicXML, 4-string TAB, chords, MIDI, and MuseScore scores."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "yt-dlp>=2024.8.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
ml = [
    "basic-pitch[onnx]>=0.3.0",
    "demucs>=4.0.0",
    "librosa>=0.10.0",
    "pretty_midi>=0.2.10",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
bass-mcp = "bass_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
